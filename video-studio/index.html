<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1d" />
    <title>Animots</title>
    <meta name="description" content="Animots : vos mots prennent vie. Collez un texte, il devient une vidéo animée pour TikTok, Reels, Shorts et YouTube." />
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./img/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Animots" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Anton&family=Bebas+Neue&family=Bangers&family=Permanent+Marker&family=Poppins:wght@800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Dépendance du moteur de voix (Piper) : version fixée, identique aux fichiers WebAssembly qu'il télécharge. -->
    <script type="importmap">
      { "imports": { "onnxruntime-web/wasm": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js" } }
    </script>
  </head>
  <body>
    <header class="top">
      <div>
        <h1 class="brand-title"><img class="brand-logo" src="./img/logo.svg" alt="" width="40" height="40" /><span id="appTitle">Animots</span></h1>
        <p id="tagline" class="muted"></p>
      </div>
      <div class="top-actions">
      <button id="installBtn" class="btn sm" type="button" hidden></button>
      <button id="accountBtn" class="btn sm" type="button" hidden></button>
      <select id="uiLang">
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="en">EN</option>
      </select>
      </div>
    </header>
    <main class="layout">
      <div class="preview">
        <div id="stageWrap" class="stage-wrap" data-format="9:16">
          <canvas id="stage" width="1080" height="1920"></canvas>
        </div>
        <div class="transport">
          <button id="playBtn" class="btn round" aria-label="Lecture">▶</button>
          <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Position" />
          <span id="time" class="muted">0:00 / 0:00</span>
        </div>
        <aside id="adSlot" class="ad-slot" hidden></aside>
      </div>
      <div class="editor">
        <nav id="tabs" class="tabs" role="tablist"></nav>
        <div id="panel" class="panel"></div>
      </div>
    </main>
    <footer id="appFooter" class="app-footer muted" hidden></footer>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
