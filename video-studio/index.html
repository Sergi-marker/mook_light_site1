<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1d" />
    <title>Vidéo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1 id="appTitle">Vidéo Studio</h1>
        <p id="tagline" class="muted"></p>
      </div>
      <select id="uiLang">
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="en">EN</option>
      </select>
    </header>
    <main class="layout">
      <div class="preview">
        <div id="stageWrap" class="stage-wrap" data-format="9:16">
          <canvas id="stage" width="1080" height="1920"></canvas>
        </div>
        <div class="transport">
          <button id="playBtn" class="btn round" aria-label="Lecture">▶</button>
          <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Position" />
          <span id="time" class="muted">0:00 / 0:00</span>
        </div>
      </div>
      <div class="editor">
        <nav id="tabs" class="tabs" role="tablist"></nav>
        <div id="panel" class="panel"></div>
      </div>
    </main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
